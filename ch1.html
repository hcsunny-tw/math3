          { id: 7, q: "同上一題的卡片 5、0、9、3，請組成一個『最小的四位數』。（注意：千位不能是 0）", a: "3059", hint: "最小的數要把小的數字放前面，但最高位（千位）不能是 0 喔！", similar: { id: "7-S", masterId: 7, q: "【復活試煉】有四張卡片：7、0、8、2。請組成一個『最小的四位數』。（注意：千位不能是 0）", a: "2078", hint: "最小的數要把小的數字放前面，但最高位（千位）不能是 0 喔！" } },
          { id: 8, q: "四位騎士的戰鬥力：A是4809，B是4901，C是4890，D是4099。請問最高戰鬥力是多少？", a: "4901", hint: "先比較千位（都是 4），再比較百位，誰的百位最大呢？", similar: { id: "8-S", masterId: 8, q: "【復活試煉】四位騎士的戰鬥力：A是5608，B是5806，C是5086，D是5680。請問最高戰鬥力是多少？", a: "5806", hint: "先比較千位（都是 5），再比較百位，誰的百位最大呢？" } },

      {

        questions: [
          { id: 10, q: "數線上記錄著：[ 4600 ] ➔ [ 4700 ] ➔ [  ?  ] ➔ [ 4900 ]。請問 [ ? ] 的數字是多少？", a: "4800", hint: "觀察一下，向右每走一格是增加 100 喔！", similar: { id: "10-S", masterId: 10, q: "【復活試煉】數線上記錄著：[ 3500 ] ➔ [ 3600 ] ➔ [  ?  ] ➔ [ 3800 ]。請問 [ ? ] 的數字是多少？", a: "3700", hint: "觀察一下，向右每走一格是增加 100 喔！" } },
          { id: 11, q: "數線上記錄著：[ 2100 ] ➔ [ 2150 ] ➔ [ 2200 ] ➔ [  A  ] ➔ [ 2300 ]。請問字母 A 代表多少？", a: "2250", hint: "向右每走一格是增加 50，2200 再加 50 是多少呢？", similar: { id: "11-S", masterId: 11, q: "【復活試煉】數線上記錄著：[ 1200 ] ➔ [ 1250 ] ➔ [ 1300 ] ➔ [  A  ] ➔ [ 1400 ]。請問字母 A 代表多少？", a: "1350", hint: "向右每走一格是增加 50，1300 再加 50 是多少呢？" } }

        questions: [
          { id: 12, q: "密碼提示：一個四位數。比6000大，比7000小。百位是3，十位是8，個位比十位小2。密碼是？", a: "6386", hint: "一步步推算：千位是6、百位是3、十位是8，個位是 8-2 喔！", similar: { id: "12-S", masterId: 12, q: "【復活試煉】密碼提示：一個四位數。比8000大，比9000小。百位是5，十位是7，個位比十位大2。密碼是？", a: "8579", hint: "一步步推算：千位是8、百位是5、十位是7，個位是 7+2 喔！" } }

    const { useState, useEffect } = React;
    const SAVE_KEY = 'math_escape_room_save';

    function MathEscapeRoom() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [gameState, setGameState] = useState('start');
      const [seatNumber, setSeatNumber] = useState('');
      const [activeGameData, setActiveGameData] = useState(GAME_DATA);
      const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [inputValue, setInputValue] = useState('');
      const [errorHint, setErrorHint] = useState('');
      const [timeLeft, setTimeLeft] = useState(15 * 60);
      const [lives, setLives] = useState(3);
      const [wrongHistory, setWrongHistory] = useState([]);
      const [redemptionQuestions, setRedemptionQuestions] = useState([]);
      const [currentRedemptionIdx, setCurrentRedemptionIdx] = useState(0);
      
      const [showTeacherModal, setShowTeacherModal] = useState(false);
      const [scriptUrl, setScriptUrl] = useState('');
      const [sheetUrl, setSheetUrl] = useState('');

      // 載入進度 (防重新整理)
      useEffect(() => {
        const saved = sessionStorage.getItem(SAVE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.gameState === 'playing' || parsed.gameState === 'redemption') {
              setGameState(parsed.gameState);
              setSeatNumber(parsed.seatNumber);
              setActiveGameData(parsed.activeGameData);
              setCurrentLevelIdx(parsed.currentLevelIdx);
              setCurrentQuestionIdx(parsed.currentQuestionIdx);
              setInputValue(parsed.inputValue || '');
              setTimeLeft(parsed.timeLeft);
              setLives(parsed.lives);
              setWrongHistory(parsed.wrongHistory);
              setRedemptionQuestions(parsed.redemptionQuestions);
              setCurrentRedemptionIdx(parsed.currentRedemptionIdx);
            }
          } catch(e) {
            console.error("無法載入進度", e);
          }
        }
        setIsLoaded(true);

        // 載入老師的設定
        const urlParams = new URLSearchParams(window.location.search);
        const urlScript = urlParams.get('scriptUrl');
        if (urlScript) {
          setScriptUrl(urlScript);
          localStorage.setItem('math_game_script_url', urlScript);
        } else {
          setScriptUrl(localStorage.getItem('math_game_script_url') || '');
        }
        setSheetUrl(localStorage.getItem('math_game_sheet_url') || '');
      }, []);

      // 儲存進度機制 (只在遊戲中儲存)
      useEffect(() => {
        if (!isLoaded) return;
        if (gameState === 'playing' || gameState === 'redemption') {
          const stateToSave = {
            gameState, seatNumber, activeGameData, currentLevelIdx, currentQuestionIdx, 
            inputValue, timeLeft, lives, wrongHistory, redemptionQuestions, currentRedemptionIdx
          };
          sessionStorage.setItem(SAVE_KEY, JSON.stringify(stateToSave));
        } else if (gameState === 'start' || gameState === 'success' || gameState === 'timeout' || gameState === 'gameover') {
          sessionStorage.removeItem(SAVE_KEY);
        }
      }, [gameState, seatNumber, activeGameData, currentLevelIdx, currentQuestionIdx, inputValue, timeLeft, lives, wrongHistory, redemptionQuestions, currentRedemptionIdx, isLoaded]);

      // 撒花特效
      useEffect(() => {
        if (gameState === 'success' && typeof confetti === 'function') {
          confetti({
            particleCount: 200,
            spread: 90,
            origin: { y: 0.6 },
            colors: ['#facc15', '#3b82f6', '#22c55e', '#ef4444'],
            zIndex: 100
          });
        }
      }, [gameState]);

      const totalQuestions = activeGameData.reduce((acc, level) => acc + level.questions.length, 0);
      const currentGlobalQuestionIdx = activeGameData.slice(0, currentLevelIdx).reduce((acc, level) => acc + level.questions.length, 0) + currentQuestionIdx + 1;
      const isRedemption = gameState === 'redemption';
      
      const displayLevel = isRedemption ? { title: "最終考驗：錯題復活試煉", story: "守衛擋住了寶藏庫的大門：「你剛才有些地方不夠細心喔！請把這幾道類似的謎題解開，證明你的實力才能通關！」", icon: "🛡️✨" } : activeGameData[currentLevelIdx];
      const displayQuestion = isRedemption ? redemptionQuestions[currentRedemptionIdx] : displayLevel?.questions[currentQuestionIdx];
      const progressPercent = isRedemption ? ((currentRedemptionIdx) / redemptionQuestions.length) * 100 : (currentGlobalQuestionIdx / totalQuestions) * 100;

      useEffect(() => {
        let timer;
        if ((gameState === 'playing' || gameState === 'redemption') && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft((prev) => prev - 1), 1000);
        } else if (timeLeft === 0 && (gameState === 'playing' || gameState === 'redemption')) {
          handleGameEnd('timeout');
        }
        return () => clearInterval(timer);
      }, [gameState, timeLeft]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const sendDataToGoogleSheet = (finalState, finalWrongHistory) => {
        if (!scriptUrl) return;
        const timeSpent = formatTime(15 * 60 - timeLeft);
        const formData = new URLSearchParams();
        
        formData.append('studentName', seatNumber.trim() ? `${seatNumber.trim()}號` : '未填寫');
        formData.append('timeUsed', timeSpent);

        for (let i = 1; i <= 12; i++) {
          const isWrong = finalWrongHistory.some(item => item.id === i);
          formData.append(`q${i}`, isWrong ? '錯誤' : '正確');
        }

        try {
          fetch(scriptUrl, { method: 'POST', mode: 'no-cors', body: formData });
        } catch (e) {
          console.error("資料傳送失敗:", e);
        }
      };

      const handleGameEnd = (finalState, updatedWrongHistory = wrongHistory) => {
        setGameState(finalState);
        sendDataToGoogleSheet(finalState, updatedWrongHistory);
      };

      // 專屬數字鍵盤處理邏輯
      const handleNumpad = (val) => {
        if (val === 'clear') {
          setInputValue('');
        } else if (val === 'del') {
          setInputValue(prev => prev.slice(0, -1));
        } else {
          setInputValue(prev => prev.length < 6 ? prev + val : prev);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!inputValue.trim()) return;

        if (inputValue.trim() === displayQuestion.a) {
          setErrorHint('');
          setInputValue('');
          
          if (isRedemption) {
            if (currentRedemptionIdx + 1 < redemptionQuestions.length) {
              setCurrentRedemptionIdx(currentRedemptionIdx + 1);
            } else {
              handleGameEnd('success');
            }
          } else {
            if (currentQuestionIdx + 1 < displayLevel.questions.length) {
              setCurrentQuestionIdx(currentQuestionIdx + 1);
            } else {
              if (currentLevelIdx + 1 < activeGameData.length) {
                setCurrentLevelIdx(currentLevelIdx + 1);
                setCurrentQuestionIdx(0);
              } else {
                if (wrongHistory.length > 0) {
                  setRedemptionQuestions(wrongHistory.map(item => item.similar));
                  setGameState('redemption');
                  setCurrentRedemptionIdx(0);
                } else {
                  handleGameEnd('success');
                }
              }
            }
          }
        } else {
          const newLives = lives - 1;
          setLives(newLives);
          setErrorHint(`解碼失敗，再試一次！${displayQuestion.hint}`);
          setInputValue(''); // 答錯自動清空輸入框，方便重按
          
          let newWrongHistory = wrongHistory;
          if (!isRedemption) {
            if (!wrongHistory.find(item => item.id === displayQuestion.id)) {
              newWrongHistory = [...wrongHistory, {
                id: displayQuestion.id,
                title: displayLevel.title,
                q: displayQuestion.q,
                a: displayQuestion.a,
                hint: displayQuestion.hint,
                similar: displayQuestion.similar
              }];
              setWrongHistory(newWrongHistory);
            }
          }

          if (newLives <= 0) {
            handleGameEnd('gameover', newWrongHistory);
          }
        }
      };

      const startGame = () => {
        const randomizedData = GAME_DATA.map(level => ({
          ...level,
          questions: [...level.questions].sort(() => Math.random() - 0.5)
        }));
        
        setActiveGameData(randomizedData);
        setGameState('playing');
        setCurrentLevelIdx(0);
        setCurrentQuestionIdx(0);
        setTimeLeft(15 * 60);
        setLives(3);
        setWrongHistory([]);
        setRedemptionQuestions([]);
        setCurrentRedemptionIdx(0);
        setInputValue('');
        setErrorHint('');
      };

      const saveTeacherSettings = () => {
        localStorage.setItem('math_game_script_url', scriptUrl.trim());
        localStorage.setItem('math_game_sheet_url', sheetUrl.trim());
        setShowTeacherModal(false);
      };

      const currentAppUrl = window.location.href.split('?')[0];
      const studentShareUrl = scriptUrl ? `${currentAppUrl}?scriptUrl=${encodeURIComponent(scriptUrl)}` : currentAppUrl;
      const studentQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(studentShareUrl)}`;

      if (!isLoaded) return <div className="h-screen w-screen flex items-center justify-center bg-gray-100">載入中...</div>;

      if (gameState === 'start') {
        return (
          <div className="min-h-screen w-full flex flex-col items-center justify-center p-4 relative py-12">
            <button onClick={() => setShowTeacherModal(true)} className="absolute top-4 right-4 bg-white text-gray-800 font-bold p-3 rounded-full flex items-center space-x-2 btn-lego z-20">
              <Settings className="w-6 h-6 text-indigo-600" /><span className="hidden sm:inline text-sm">教師後台</span>
            </button>

            <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-lg w-full text-center card-lego my-auto">
              <div className="text-6xl mb-4 drop-shadow-md">🏰</div>
              <h1 className="text-3xl sm:text-4xl font-black text-gray-900 mb-3 leading-tight tracking-wide">
                數字王國的神秘寶藏<br/><span className="text-xl sm:text-2xl text-blue-600 mt-2 block">10000以內的數</span>
              </h1>
              
              <div className="mb-5 text-left mt-6">
                <label className="block text-gray-800 font-bold mb-2 text-sm sm:text-base">✏️ 請輸入你的座號：</label>
                <input type="number" min="1" max="60" value={seatNumber} onChange={(e) => setSeatNumber(e.target.value)} placeholder="例如：15" className="w-full text-lg p-3 border-2 border-gray-800 rounded-xl focus:outline-none focus:ring-4 focus:ring-yellow-200 transition-all font-bold" />
              </div>

              <div className="bg-yellow-50 rounded-xl p-4 mb-6 border-2 border-yellow-400 text-left">
                <h2 className="text-base font-black mb-2 flex items-center text-yellow-800"><AlertCircle className="mr-1.5 text-yellow-600 w-5 h-5"/> 遊戲規則</h2>
                <ul className="list-disc list-inside space-y-1.5 text-gray-800 font-bold text-sm sm:text-base">
                  <li>限時 <span className="text-red-500">15分鐘</span>，有防斷線機制，重新整理也不怕。</li>
                  <li>你有 <span className="text-red-500">3顆愛心</span>，答錯會扣血！</li>
                  <li>若答錯題目，最後將進入「復活試煉」。</li>
                </ul>
              </div>

              <button onClick={startGame} className="w-full bg-blue-500 text-white font-black text-xl sm:text-2xl py-4 px-6 rounded-xl btn-lego mb-4">開始闖關！</button>

              {scriptUrl && (
                <div className="mt-6 pt-6 border-t-2 border-gray-200 flex flex-col items-center bg-gray-50 rounded-xl pb-2">
                  <p className="text-gray-800 font-black mb-3">📲 學生請掃碼進入遊戲</p>
                  <img src={studentQrUrl} alt="學生QRcode" className="w-40 h-40 border-4 border-gray-800 rounded-xl shadow-[4px_4px_0_0_#1f2937] bg-white p-2" />
                  <p className="text-xs text-gray-500 mt-3 font-bold">掃描後成績將自動上傳</p>
                </div>
              )}
            </div>

            {showTeacherModal && (
              <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl max-w-2xl w-full p-6 card-lego max-h-[90vh] overflow-y-auto text-left">
                  <div className="flex justify-between items-center mb-4 border-b-2 border-gray-100 pb-3">
                    <h2 className="text-2xl font-black text-gray-800 flex items-center"><Settings className="mr-2 text-indigo-600" /> 教師後台設定</h2>
                    <button onClick={() => setShowTeacherModal(false)} className="text-gray-500 hover:text-gray-900 font-black text-2xl">✕</button>
                  </div>
                  <div className="space-y-5">
                    <div className="bg-gray-50 p-4 rounded-xl border-2 border-gray-200">
                      <h3 className="font-bold text-gray-900 text-lg mb-2">1. Google Apps Script 網址</h3>
                      <input type="text" value={scriptUrl} onChange={(e) => setScriptUrl(e.target.value)} placeholder="https://script.google.com/..." className="w-full p-3 bg-white border-2 border-gray-300 rounded-lg text-sm mb-2 outline-none" />
                    </div>
                  </div>
                  <div className="mt-6 flex justify-end">
                    <button onClick={saveTeacherSettings} className="bg-yellow-400 text-gray-900 font-black px-6 py-3 rounded-xl btn-lego text-sm">儲存設定並關閉</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      if (gameState === 'success' || gameState === 'timeout' || gameState === 'gameover') {
        const isSuccess = gameState === 'success';
        let statusIcon = '👑';
        let statusTitle = '恭喜通關！找到寶藏了！';
        let statusMessage = `${seatNumber ? seatNumber + '號探險家，' : ''}你花了 ${formatTime(15 * 60 - timeLeft)} 成功解開所有謎題！`;
        if (gameState === 'timeout') { statusIcon = '⏰'; statusTitle = '啊！時間到了！'; statusMessage = '不要灰心，多練習幾次，你一定可以通關的！'; }
        else if (gameState === 'gameover') { statusIcon = '💔'; statusTitle = '哎呀！能量耗盡了！'; statusMessage = '沒關係，看看下方的錯題檢討，重新挑戰一次吧！'; }

        return (
          <div className="min-h-screen w-full overflow-y-auto flex flex-col items-center justify-start p-4 py-8 relative">
            <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-xl w-full text-center card-lego mb-6 shrink-0 z-10">
              <div className="text-6xl mb-4">{statusIcon}</div>
              <h1 className="text-3xl font-black mb-3 text-gray-900">{statusTitle}</h1>
              <p className="text-lg text-gray-700 font-bold mb-6">{statusMessage}</p>
              
              {scriptUrl && (
                <div className="mb-6 bg-green-50 text-green-800 p-3 rounded-xl text-sm font-bold border-2 border-green-300">✅ 你的成績已自動傳送給老師！</div>
              )}
              <button onClick={startGame} className="flex items-center justify-center w-full bg-blue-500 text-white font-black text-xl py-4 px-6 rounded-xl btn-lego">
                <RefreshCw className="mr-2 w-6 h-6" /> {isSuccess ? '再玩一次' : '重新挑戰'}
              </button>
            </div>

            {wrongHistory.length > 0 && (
              <div className="bg-white rounded-2xl p-6 max-w-xl w-full card-lego shrink-0 mb-6 z-10">
                <h2 className="text-xl font-black text-gray-900 mb-4 flex items-center justify-center"><AlertCircle className="mr-2 w-6 h-6 text-red-500" /> 錯題檢討筆記</h2>
                <div className="space-y-4 text-left">
                  {wrongHistory.map((item, index) => (
                    <div key={index} className="bg-red-50 p-4 rounded-xl border-2 border-red-200">
                      <div className="text-sm text-red-600 font-black mb-2 flex justify-between items-center">
                        <span>{item.title}</span><span className="bg-white text-red-600 border-2 border-red-200 px-2.5 py-1 rounded-lg">第 {item.id} 題</span>
                      </div>
                      <div className="text-base text-gray-900 font-bold mb-3 leading-relaxed">{item.q}</div>
                      <div className="text-green-800 font-black bg-green-100 border-2 border-green-300 px-3 py-1.5 rounded-lg inline-block text-sm mb-2">正確解答：{item.a}</div>
                      <div className="text-gray-700 font-bold text-sm flex items-start mt-1">💡 <span className="ml-1">{item.hint}</span></div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="h-screen w-screen flex flex-col overflow-hidden">
          <div className="bg-white px-4 py-3 shrink-0 border-b-2 border-gray-200 z-10 relative">
            <div className="max-w-3xl mx-auto flex justify-between items-center">
              <div className="flex items-center space-x-1.5 text-base font-black text-gray-800">
                <Trophy className="w-5 h-5 text-yellow-500" />
                <span>{isRedemption ? `補考：${currentRedemptionIdx + 1} / ${redemptionQuestions.length}` : `進度：${currentGlobalQuestionIdx} / ${totalQuestions}`}</span>
              </div>
              <div className="flex items-center space-x-1 text-red-500">
                {[...Array(3)].map((_, i) => <Heart key={i} fill={i < lives ? "currentColor" : "none"} className="w-6 h-6" />)}
              </div>
              <div className="flex items-center space-x-1.5 text-lg font-black text-gray-800 bg-gray-100 px-3 py-1 rounded-lg border-2 border-gray-200">
                <Clock className="w-5 h-5" />
                <span className={timeLeft < 180 ? 'text-red-600 animate-pulse' : ''}>{formatTime(timeLeft)}</span>
              </div>
            </div>
            <div className="max-w-3xl mx-auto mt-3 bg-gray-200 rounded-full h-3 overflow-hidden border-2 border-gray-300">
              <div className={`h-full transition-all duration-500 ease-out ${isRedemption ? 'bg-orange-500' : 'bg-blue-500'}`} style={{ width: `${progressPercent}%` }}></div>
            </div>
          </div>

          <div className="flex-1 flex flex-col items-center p-3 overflow-y-auto relative">
            <div className="max-w-3xl w-full flex flex-col bg-white rounded-2xl card-lego overflow-hidden my-auto shrink-0 pb-4">
              <div className={`px-5 py-4 border-b-2 border-gray-800 shrink-0 ${isRedemption ? 'bg-orange-100' : 'bg-yellow-100'}`}>
                <h2 className="text-xl font-black text-gray-900 flex items-center">
                  <span className="text-3xl mr-3 drop-shadow-sm">{displayLevel.icon}</span>{displayLevel.title}
                </h2>
                <p className="text-sm mt-2 font-bold text-gray-700 leading-relaxed">{displayLevel.story}</p>
              </div>

              <div className="p-4 sm:p-6 flex flex-col justify-between bg-white">
                <div>
                  <p className="text-lg sm:text-xl text-gray-900 font-black leading-relaxed">{displayQuestion.q}</p>
                </div>

                <form onSubmit={handleSubmit} className="mt-4">
                  <label className="block text-gray-800 font-black mb-2 text-sm flex items-center"><Key className="w-4 h-4 mr-1 text-yellow-500" /> 已輸入：</label>
                  {/* 使用 inputMode="none" 與 readOnly 防止平板鍵盤彈出 */}
                  <input type="text" inputMode="none" readOnly value={inputValue} className={`w-full text-3xl font-black p-3 border-2 rounded-xl text-center focus:outline-none transition-all h-14 ${errorHint ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-800 bg-gray-50'}`} placeholder="請使用下方鍵盤" />
                  
                  {errorHint && (
                    <div className="bg-red-50 text-red-700 p-2.5 rounded-xl flex items-start text-sm font-black border-2 border-red-200 animate-pulse mt-3">
                      <XCircle className="w-5 h-5 mr-2 flex-shrink-0" /><span>{errorHint}</span>
                    </div>
                  )}

                  {/* 專屬微積木數字鍵盤 */}
                  <div className="grid grid-cols-3 gap-2 sm:gap-3 mt-4">
                    {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                      <button type="button" key={num} onClick={() => handleNumpad(num.toString())} className="bg-gray-100 text-gray-900 font-black text-2xl py-3 rounded-xl btn-lego active:bg-gray-200">{num}</button>
                    ))}
                    <button type="button" onClick={() => handleNumpad('clear')} className="bg-red-100 text-red-700 font-black text-lg py-3 rounded-xl btn-lego active:bg-red-200">清除</button>
                    <button type="button" onClick={() => handleNumpad('0')} className="bg-gray-100 text-gray-900 font-black text-2xl py-3 rounded-xl btn-lego active:bg-gray-200">0</button>
                    <button type="button" onClick={() => handleNumpad('del')} className="bg-yellow-100 text-yellow-800 font-black text-lg py-3 rounded-xl btn-lego active:bg-yellow-200 flex justify-center items-center">⌫</button>
                  </div>

                  <button type="submit" className="w-full flex items-center justify-center bg-green-500 text-white font-black text-xl sm:text-2xl py-4 rounded-xl btn-lego mt-4">
                    送出答案 <ChevronRight className="w-6 h-6 ml-1" />
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MathEscapeRoom />);
  </script>
</body>
</html>
