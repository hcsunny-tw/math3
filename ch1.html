    const { useState, useEffect } = React;

    function MathEscapeRoom() {
      const [gameState, setGameState] = useState('start'); // start, playing, redemption, success, timeout, gameover
      const [seatNumber, setSeatNumber] = useState('');
      const [activeGameData, setActiveGameData] = useState(GAME_DATA);
      const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [inputValue, setInputValue] = useState('');
      const [errorHint, setErrorHint] = useState('');
      const [timeLeft, setTimeLeft] = useState(15 * 60);
      const [lives, setLives] = useState(3);
      const [wrongHistory, setWrongHistory] = useState([]);
      const [redemptionQuestions, setRedemptionQuestions] = useState([]);
      const [currentRedemptionIdx, setCurrentRedemptionIdx] = useState(0);
      
      // Teacher Settings State
      const [showTeacherModal, setShowTeacherModal] = useState(false);
      const [scriptUrl, setScriptUrl] = useState('');
      const [sheetUrl, setSheetUrl] = useState('');
      const [copyStatus, setCopyStatus] = useState(false);

      // Check URL parameters for scriptUrl (when students scan teacher's QR code)
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlScript = urlParams.get('scriptUrl');
        const savedScript = localStorage.getItem('math_game_script_url');
        const savedSheet = localStorage.getItem('math_game_sheet_url');

        if (urlScript) {
          setScriptUrl(urlScript);
          localStorage.setItem('math_game_script_url', urlScript);
        } else if (savedScript) {
          setScriptUrl(savedScript);
        }

        if (savedSheet) {
          setSheetUrl(savedSheet);
        }
      }, []);

      const totalQuestions = activeGameData.reduce((acc, level) => acc + level.questions.length, 0);
      const currentGlobalQuestionIdx = activeGameData.slice(0, currentLevelIdx).reduce((acc, level) => acc + level.questions.length, 0) + currentQuestionIdx + 1;
      
      const isRedemption = gameState === 'redemption';
      
      const displayLevel = isRedemption ? {
        title: "最終考驗：錯題復活試煉",
        story: "守衛擋住了寶藏庫的大門：「你剛才有些地方不夠細心喔！請把這幾道類似的謎題解開，證明你的實力才能通關！」",
        icon: "🛡️✨"
      } : activeGameData[currentLevelIdx];
      
      const displayQuestion = isRedemption 
        ? redemptionQuestions[currentRedemptionIdx] 
        : displayLevel?.questions[currentQuestionIdx];

      const progressPercent = isRedemption
        ? ((currentRedemptionIdx) / redemptionQuestions.length) * 100
        : (currentGlobalQuestionIdx / totalQuestions) * 100;

      useEffect(() => {
        let timer;
        if ((gameState === 'playing' || gameState === 'redemption') && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft((prev) => prev - 1);
          }, 1000);
        } else if (timeLeft === 0 && (gameState === 'playing' || gameState === 'redemption')) {
          handleGameEnd('timeout');
        }
        return () => clearInterval(timer);
      }, [gameState, timeLeft]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const sendDataToGoogleSheet = (finalState, finalWrongHistory) => {
        if (!scriptUrl) return;

        const timeSpent = formatTime(15 * 60 - timeLeft);
        const wrongIdsList = finalWrongHistory.map(item => `題號#${item.id}`).join(', ') || '無錯題';

        let statusText = '成功通關';
        if (finalState === 'timeout') statusText = '超時未完成';
        if (finalState === 'gameover') statusText = '生命用盡(失敗)';

        const payload = {
          studentName: seatNumber.trim() ? `${seatNumber.trim()}號` : '未填寫座號',
          status: statusText,
          timeUsed: timeSpent,
          livesLeft: lives,
          wrongQuestionIds: wrongIdsList
        };

        try {
          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.error("資料傳送失敗:", e);
        }
      };

      const handleGameEnd = (finalState, updatedWrongHistory = wrongHistory) => {
        setGameState(finalState);
        sendDataToGoogleSheet(finalState, updatedWrongHistory);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!inputValue.trim()) return;

        if (inputValue.trim() === displayQuestion.a) {
          // 答對
          setErrorHint('');
          setInputValue('');
          
          if (isRedemption) {
            if (currentRedemptionIdx + 1 < redemptionQuestions.length) {
              setCurrentRedemptionIdx(currentRedemptionIdx + 1);
            } else {
              handleGameEnd('success');
            }
          } else {
            if (currentQuestionIdx + 1 < displayLevel.questions.length) {
              setCurrentQuestionIdx(currentQuestionIdx + 1);
            } else {
              if (currentLevelIdx + 1 < activeGameData.length) {
                setCurrentLevelIdx(currentLevelIdx + 1);
                setCurrentQuestionIdx(0);
              } else {
                if (wrongHistory.length > 0) {
                  setRedemptionQuestions(wrongHistory.map(item => item.similar));
                  setGameState('redemption');
                  setCurrentRedemptionIdx(0);
                } else {
                  handleGameEnd('success');
                }
              }
            }
          }
        } else {
          // 答錯
          const newLives = lives - 1;
          setLives(newLives);
          setErrorHint(`解碼失敗，再試一次！${displayQuestion.hint}`);
          
          let newWrongHistory = wrongHistory;
          if (!isRedemption) {
            if (!wrongHistory.find(item => item.id === displayQuestion.id)) {
              newWrongHistory = [...wrongHistory, {
                id: displayQuestion.id, // Master Question ID
                title: displayLevel.title,
                q: displayQuestion.q,
                a: displayQuestion.a,
                hint: displayQuestion.hint,
                similar: displayQuestion.similar
              }];
              setWrongHistory(newWrongHistory);
            }
          }

          if (newLives <= 0) {
            handleGameEnd('gameover', newWrongHistory);
          }
        }
      };

      const startGame = () => {
        // 隨機打亂關卡與題目順序
        const randomizedData = GAME_DATA.map(level => ({
          ...level,
          questions: [...level.questions].sort(() => Math.random() - 0.5)
        }));
        
        setActiveGameData(randomizedData);
        setGameState('playing');
        setCurrentLevelIdx(0);
        setCurrentQuestionIdx(0);
        setTimeLeft(15 * 60);
        setLives(3);
        setWrongHistory([]);
        setRedemptionQuestions([]);
        setCurrentRedemptionIdx(0);
        setInputValue('');
        setErrorHint('');
      };

      const saveTeacherSettings = () => {
        localStorage.setItem('math_game_script_url', scriptUrl.trim());
        localStorage.setItem('math_game_sheet_url', sheetUrl.trim());
        setShowTeacherModal(false);
      };

      const googleScriptCode = `function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = JSON.parse(e.postData.contents);
  sheet.appendRow([
    new Date(),
    data.studentName,
    data.status,
    data.timeUsed,
    data.livesLeft,
    data.wrongQuestionIds
  ]);
  return ContentService.createTextOutput("Success");
}`;

      const handleCopyCode = () => {
        document.execCommand ? document.execCommand('copy') : navigator.clipboard.writeText(googleScriptCode);
        setCopyStatus(true);
        setTimeout(() => setCopyStatus(false), 2000);
      };

      // Generate Student Game URL embedded with Script URL
      const currentAppUrl = window.location.href.split('?')[0];
      const studentShareUrl = scriptUrl 
        ? `${currentAppUrl}?scriptUrl=${encodeURIComponent(scriptUrl)}`
        : currentAppUrl;

      const studentQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(studentShareUrl)}`;
      const sheetQrUrl = sheetUrl ? `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(sheetUrl)}` : '';

      if (gameState === 'start') {
        return (
          <div className="min-h-screen w-full bg-gradient-to-b from-blue-300 to-green-200 flex items-center justify-center p-4 relative">
            
            {/* 教師設定按鈕 */}
            <button 
              onClick={() => setShowTeacherModal(true)}
              className="absolute top-4 right-4 bg-white/90 hover:bg-white text-gray-700 font-bold p-3 rounded-full shadow-lg flex items-center space-x-2 border border-gray-200 cursor-pointer transition-transform hover:scale-105 z-20"
              title="教師後台設定"
            >
              <Settings className="w-6 h-6 text-indigo-600" />
              <span className="hidden sm:inline text-sm">教師後台設定</span>
            </button>

            <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-lg w-full text-center border-4 border-yellow-400 my-auto">
              <div className="text-5xl mb-2">🏰</div>
              <h1 className="text-3xl sm:text-4xl font-bold text-gray-800 mb-3 leading-tight">
                數字王國的神秘寶藏<br/>
                <span className="text-xl sm:text-2xl text-blue-600">10000以內的數</span>
              </h1>
              
              <div className="mb-4 text-left">
                <label className="block text-gray-700 font-bold mb-1 text-sm sm:text-base">
                  ✏️ 請輸入你的座號：
                </label>
                <input 
                  type="number"
                  min="1"
                  max="60"
                  value={seatNumber}
                  onChange={(e) => setSeatNumber(e.target.value)}
                  placeholder="例如：15"
                  className="w-full text-lg p-2.5 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-500 bg-indigo-50/50"
                />
              </div>

              <div className="bg-yellow-50 rounded-xl p-4 mb-5 border border-yellow-200 text-left">
                <h2 className="text-base font-bold mb-1.5 flex items-center text-yellow-800">
                  <AlertCircle className="mr-1.5 text-yellow-600 w-5 h-5"/> 遊戲規則：
                </h2>
                <ul className="list-disc list-inside space-y-1 text-gray-700 text-sm sm:text-base">
                  <li>這是一個限時 <strong>15分鐘</strong> 的闖關遊戲。</li>
                  <li>你總共有 <strong>3顆愛心（生命值）</strong>，答錯會扣血！</li>
                  <li>若答錯題目，最後將進入<strong>「復活試煉」</strong>。</li>
                  <li><strong>必須連類似題都答對，才能真正獲得寶藏！</strong></li>
                </ul>
              </div>

              <button 
                onClick={startGame}
                className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold text-xl sm:text-2xl py-3.5 px-6 rounded-full shadow-[0_5px_0_#c05600] active:shadow-none active:translate-y-[5px] transition-all cursor-pointer"
              >
                開始闖關！
              </button>
            </div>

            {/* 教師設定彈出視窗 Modal */}
            {showTeacherModal && (
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border-4 border-indigo-500 max-h-[90vh] overflow-y-auto text-left">
                  <div className="flex justify-between items-center mb-4 border-b pb-3">
                    <h2 className="text-2xl font-bold text-indigo-700 flex items-center">
                      <Settings className="mr-2" /> 教師後台設定與統計 QR Code
                    </h2>
                    <button 
                      onClick={() => setShowTeacherModal(false)}
                      className="text-gray-400 hover:text-gray-600 font-bold text-2xl"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-5">
                    {/* 步驟一：Google Apps Script 網址輸入 */}
                    <div className="bg-indigo-50 p-4 rounded-2xl border border-indigo-200">
                      <h3 className="font-bold text-indigo-900 text-lg mb-2">1. 貼上 Google Apps Script 網址 (網頁應用程式)</h3>
                      <input 
                        type="text" 
                        value={scriptUrl}
                        onChange={(e) => setScriptUrl(e.target.value)}
                        placeholder="https://script.google.com/macros/s/.../exec"
                        className="w-full p-2.5 bg-white border border-indigo-300 rounded-xl text-sm mb-2 focus:ring-2 focus:ring-indigo-400"
                      />
                      <p className="text-xs text-gray-600">設定後，學生的遊戲成績與錯題號碼會自動寫入您的 Google 試算表。</p>
                    </div>

                    {/* 步驟二：Google 試算表檢視網址 */}
                    <div className="bg-green-50 p-4 rounded-2xl border border-green-200">
                      <h3 className="font-bold text-green-900 text-lg mb-2">2. 貼上 Google 試算表網址 (供老師秒開統計)</h3>
                      <input 
                        type="text" 
                        value={sheetUrl}
                        onChange={(e) => setSheetUrl(e.target.value)}
                        placeholder="https://docs.google.com/spreadsheets/d/..."
                        className="w-full p-2.5 bg-white border border-green-300 rounded-xl text-sm mb-2 focus:ring-2 focus:ring-green-400"
                      />
                      <p className="text-xs text-gray-600">此連結將會用來產生老師專用的試算表 QR Code。</p>
                    </div>

                    {/* QR Code 產生區 */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-2xl border border-gray-200">
                      <div className="text-center p-3 bg-white rounded-xl border border-gray-200 flex flex-col items-center">
                        <span className="font-bold text-sm mb-2 text-indigo-700">📱 學生掃描進入遊戲 QR Code</span>
                        <img src={studentQrUrl} alt="學生QRcode" className="w-36 h-36 border p-1 rounded-lg mb-2" />
                        <span className="text-xs text-gray-500">已自動整合您的 Google 試算表連結</span>
                      </div>

                      <div className="text-center p-3 bg-white rounded-xl border border-gray-200 flex flex-col items-center">
                        <span className="font-bold text-sm mb-2 text-green-700">📊 老師查看成績試算表 QR Code</span>
                        {sheetQrUrl ? (
                          <img src={sheetQrUrl} alt="試算表QRcode" className="w-36 h-36 border p-1 rounded-lg mb-2" />
                        ) : (
                          <div className="w-36 h-36 bg-gray-100 flex items-center justify-center text-xs text-gray-400 rounded-lg mb-2 border text-center p-2">
                            請先在上方輸入試算表網址
                          </div>
                        )}
                        <span className="text-xs text-gray-500">老師用手機掃描即可開啟後台</span>
                      </div>
                    </div>

                    {/* 教學導引摺疊區 */}
                    <details className="bg-yellow-50 p-3.5 rounded-xl border border-yellow-200 text-xs text-gray-700">
                      <summary className="font-bold cursor-pointer text-yellow-900 text-sm">💡 如何快速建立免費的 Google 試算表後台？（點擊展開）</summary>
                      <ol className="list-decimal list-inside space-y-1.5 mt-2 leading-relaxed">
                        <li>開一個新的 Google 試算表，點選頂部選單的 <strong>「擴充功能」 ➔ 「Apps Script」</strong>。</li>
                        <li>將原本的程式碼全部刪除，並貼上以下語法：</li>
                        <div className="relative my-2">
                          <textarea 
                            readOnly 
                            value={googleScriptCode}
                            className="w-full h-28 bg-gray-900 text-green-400 font-mono text-xs p-2 rounded-lg"
                          />
                          <button 
                            onClick={handleCopyCode}
                            className="absolute top-2 right-2 bg-indigo-600 text-white text-xs px-2.5 py-1 rounded hover:bg-indigo-700 flex items-center"
                          >
                            <CopyIcon className="w-3.5 h-3.5 mr-1" /> {copyStatus ? "已複製！" : "複製語法"}
                          </button>
                        </div>
                        <li>點選右上角 <strong>「部署」 ➔ 「新建部署」</strong>。</li>
                        <li>齒輪圖示選擇 <strong>「網頁應用程式」</strong>，將「誰可以存取」設為 <strong>「任何人 (Anyone)」</strong>，點擊部署並複製獲得的 URL 貼回上方第一欄即可！</li>
                      </ol>
                    </details>
                  </div>

                  <div className="mt-6 flex justify-end space-x-3">
                    <button 
                      onClick={saveTeacherSettings}
                      className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl shadow cursor-pointer text-sm"
                    >
                      儲存設定並關閉
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      if (gameState === 'success' || gameState === 'timeout' || gameState === 'gameover') {
        const isSuccess = gameState === 'success';
        let statusIcon = '👑';
        let statusTitle = '恭喜通關！找到寶藏了！';
        let statusMessage = `${seatNumber ? seatNumber + '號探險家，' : ''}你花了 ${formatTime(15 * 60 - timeLeft)} 成功解開所有謎題（包含復活試煉）！太厲害了！`;
        
        if (gameState === 'timeout') {
          statusIcon = '⏰';
          statusTitle = '啊！時間到了！';
          statusMessage = '不要灰心，多練習幾次，你一定可以通關的！';
        } else if (gameState === 'gameover') {
          statusIcon = '💔';
          statusTitle = '哎呀！能量耗盡了！';
          statusMessage = '沒關係，看看下方的錯題檢討，重新挑戰一次吧！';
        }

        return (
          <div className={`min-h-screen w-full overflow-y-auto flex flex-col items-center justify-start p-4 py-8 ${isSuccess ? 'bg-gradient-to-b from-yellow-200 to-yellow-500' : 'bg-gradient-to-b from-gray-700 to-gray-900'}`}>
            <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-xl w-full text-center border-4 border-white mb-6 shrink-0">
              <div className="text-6xl mb-3">{statusIcon}</div>
              <h1 className={`text-3xl font-bold mb-2 ${isSuccess ? 'text-orange-600' : 'text-gray-800'}`}>
                {statusTitle}
              </h1>
              <p className="text-lg text-gray-600 mb-6">
                {statusMessage}
              </p>
              
              {scriptUrl && (
                <div className="mb-4 bg-green-50 text-green-700 p-2.5 rounded-xl text-xs font-bold border border-green-200">
                  ✅ 你的成績與錯題數據已自動傳送至老師的 Google 試算表！
                </div>
              )}

              <button 
                onClick={startGame}
                className="flex items-center justify-center w-full bg-blue-500 hover:bg-blue-600 text-white font-bold text-lg py-3 px-6 rounded-full shadow-[0_5px_0_#1e3a8a] active:shadow-none active:translate-y-[5px] transition-all cursor-pointer"
              >
                <RefreshCw className="mr-2 w-5 h-5" /> {isSuccess ? '再玩一次' : '重新挑戰'}
              </button>
            </div>

            {/* 錯題檢討區 - 清楚標註背景題庫原題號 */}
            {wrongHistory.length > 0 && (
              <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-xl w-full border-4 border-red-100 shrink-0 mb-6">
                <h2 className="text-xl font-bold text-red-600 mb-4 flex items-center justify-center">
                  <AlertCircle className="mr-2 w-6 h-6" /> 老師的秘密筆記：錯題檢討區
                </h2>
                <div className="space-y-3 text-left">
                  {wrongHistory.map((item, index) => (
                    <div key={index} className="bg-red-50 p-4 rounded-xl border border-red-100 relative">
                      <div className="text-xs text-red-500 font-bold mb-1 flex justify-between items-center">
                        <span>{item.title}</span>
                        {/* 清楚顯示背景題庫原題號 */}
                        <span className="bg-red-600 text-white font-mono text-xs px-2.5 py-0.5 rounded-full font-bold shadow-sm">
                          📌 題庫原題號：第 {item.id} 題
                        </span>
                      </div>
                      <div className="text-base text-gray-800 font-bold mb-2">{item.q}</div>
                      <div className="text-green-700 font-bold bg-green-100 px-3 py-1 rounded-lg inline-block text-sm mb-1">
                        ✅ 正確解答：{item.a}
                      </div>
                      <div className="text-gray-600 text-xs flex items-start mt-1">
                        💡 <span className="ml-1">{item.hint}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="h-screen w-screen bg-slate-50 flex flex-col overflow-hidden">
          {/* Top Bar */}
          <div className="bg-white shadow-sm px-4 py-2.5 shrink-0 border-b border-slate-200">
            <div className="max-w-2xl mx-auto flex justify-between items-center">
              <div className={`flex items-center space-x-1.5 text-base font-bold ${isRedemption ? 'text-orange-600' : 'text-indigo-600'}`}>
                <Trophy className="w-5 h-5" />
                <span>{isRedemption ? `補考：${currentRedemptionIdx + 1} / ${redemptionQuestions.length}` : `進度：${currentGlobalQuestionIdx} / ${totalQuestions}`}</span>
              </div>
              
              <div className="flex items-center space-x-1 text-red-500">
                {[...Array(3)].map((_, i) => (
                  <Heart key={i} fill={i < lives ? "currentColor" : "none"} className="w-5 h-5 sm:w-6 sm:h-6" />
                ))}
              </div>

              <div className={`flex items-center space-x-1.5 text-xl font-bold px-3 py-1 rounded-full ${timeLeft < 180 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-blue-100 text-blue-700'}`}>
                <Clock className="w-5 h-5" />
                <span>{formatTime(timeLeft)}</span>
              </div>
            </div>
            
            <div className="max-w-2xl mx-auto mt-2 bg-gray-200 rounded-full h-2 overflow-hidden">
              <div className={`h-2 rounded-full transition-all duration-500 ease-out ${isRedemption ? 'bg-orange-500' : 'bg-indigo-500'}`} style={{ width: `${progressPercent}%` }}></div>
            </div>
          </div>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col items-center justify-center p-3 sm:p-4 overflow-hidden">
            <div className={`max-w-2xl w-full h-full max-h-[85vh] flex flex-col bg-white rounded-3xl shadow-xl border overflow-hidden ${isRedemption ? 'border-orange-200' : 'border-indigo-100'}`}>
              
              <div className={`text-white px-5 py-3.5 shadow-md relative shrink-0 ${isRedemption ? 'bg-orange-600' : 'bg-indigo-600'}`}>
                <div className="absolute top-[-10px] right-[-10px] text-6xl opacity-15">{displayLevel.icon}</div>
                <h2 className="text-lg sm:text-xl font-bold flex items-center relative z-10">
                  <span className="text-2xl mr-2">{displayLevel.icon}</span>
                  {displayLevel.title}
                </h2>
                <p className={`text-sm sm:text-base relative z-10 mt-1 leading-snug ${isRedemption ? 'text-orange-100' : 'text-indigo-100'}`}>
                  {displayLevel.story}
                </p>
              </div>

              <div className="flex-1 p-4 sm:p-6 flex flex-col justify-between overflow-hidden">
                <div className={`border-l-4 p-4 rounded-r-xl my-auto ${isRedemption ? 'bg-orange-50 border-orange-500' : 'bg-blue-50 border-blue-500'}`}>
                  <p className="text-lg sm:text-xl text-gray-800 font-bold leading-relaxed">
                    {displayQuestion.q}
                  </p>
                </div>

                <form onSubmit={handleSubmit} className="space-y-3 sm:space-y-4 mt-2">
                  <div>
                    <label className="block text-gray-600 font-bold mb-1.5 text-sm sm:text-base flex items-center">
                      <Key className={`w-4 h-4 mr-1.5 ${isRedemption ? 'text-orange-500' : 'text-indigo-500'}`} /> 請輸入你的答案（數字）：
                    </label>
                    <input
                      type="number"
                      value={inputValue}
                      onChange={(e) => setInputValue(e.target.value)}
                      className={`w-full text-2xl sm:text-3xl p-2.5 sm:p-3 border-3 sm:border-4 rounded-xl text-center focus:outline-none focus:ring-4 transition-all h-12 sm:h-14 ${errorHint ? 'border-red-400 focus:ring-red-200 bg-red-50' : (isRedemption ? 'border-orange-200 focus:border-orange-500 focus:ring-orange-100' : 'border-indigo-200 focus:border-indigo-500 focus:ring-indigo-100')}`}
                      placeholder="輸入數字..."
                      autoFocus
                    />
                  </div>

                  {errorHint && (
                    <div className="bg-red-100 text-red-700 p-2.5 rounded-lg flex items-start text-xs sm:text-sm font-bold animate-bounce">
                      <XCircle className="w-4 h-4 mr-1.5 flex-shrink-0 mt-0.5" />
                      <span>{errorHint}</span>
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full flex items-center justify-center bg-green-500 hover:bg-green-600 text-white font-bold text-lg sm:text-xl py-3 rounded-xl shadow-[0_4px_0_#166534] active:shadow-none active:translate-y-[4px] transition-all cursor-pointer"
                  >
                    送出答案 <ChevronRight className="w-6 h-6 ml-1" />
                  </button>
                </form>

              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MathEscapeRoom />);
  </script>
</body>
</html>
